id: TASK-001
title: "Bootstrap Chrome MV3 extension shell"
role: developer
milestone: M0
priority: P0
status: ready

objective: "실행 가능한 최소 TypeScript 기반 Chrome MV3 Extension shell과 반복 가능한 검증 명령을 만든다."
why: "모든 Browser World, Side Panel, storage 작업이 동일한 build output과 Chrome runtime entry point를 필요로 한다."

scope:
  include:
    - "package와 TypeScript 설정 및 repository scripts"
    - "MV3 manifest와 최소 권한"
    - "Service Worker, Content Script, Side Panel entry point"
    - "개발용 placeholder UI와 clean build output"
    - "build, typecheck, lint, test 명령의 기본 wiring"
  exclude:
    - "PetState persistence 구현"
    - "Pet Overlay와 animation runtime"
    - "Pet Brain과 제품 화면 구현"

depends_on: []
specs:
  - "specs/architecture/runtime-architecture.md"
relevant_files:
  - "package.json"
  - "tsconfig.json"
  - "manifest.json"
  - "src/background/serviceWorker.ts"
  - "src/browser/contentScript.ts"
  - "src/home/index.html"
active_decisions: []
context_keys: [runtime]

acceptance:
  - "fresh install 후 문서화된 단일 명령으로 production extension bundle을 생성한다."
  - "build output의 manifest가 MV3이며 Service Worker, Content Script, Side Panel을 올바르게 참조한다."
  - "압축 해제된 build output을 Chrome에서 오류 없이 로드하고 Side Panel을 열 수 있다."
  - "Content Script가 일반 페이지에 주입되지만 host DOM을 변경하는 제품 기능은 아직 수행하지 않는다."
  - "요청하지 않은 broad host/API permission을 manifest에 추가하지 않는다."
verification:
  - "npm run build"
  - "npm run typecheck"
  - "npm run lint"
  - "npm test"
  - "Chrome에서 build output을 unpacked extension으로 로드하고 worker, content script, side panel entry를 smoke check"

human_gate: false
risk: medium

